# Example: run Kubus inside the cluster it manages.
#
#   kubectl apply -f deploy/kubernetes/kubus.yaml
#   kubectl -n kubus port-forward svc/kubus 3001:3001
#   kubectl -n kubus logs deploy/kubus | grep 'Kubus ready'   # open that URL,
#                                       # with 0.0.0.0 replaced by localhost
#
# Kubus uses the pod's ServiceAccount (in-cluster config) when no kubeconfig is
# mounted, so it can do exactly what the RBAC below grants. The example binds
# the built-in read-only "view" role; bind "edit" or "cluster-admin" instead
# for a full admin console. Everyone who can open the UI shares that identity.
#
# Behind an authenticating reverse proxy (ingress + forward-auth), see
# docs/install/container.md for KUBUS_AUTH=none and KUBUS_ALLOWED_ORIGINS.
apiVersion: v1
kind: Namespace
metadata:
  name: kubus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubus
  namespace: kubus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubus
    namespace: kubus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubus
  namespace: kubus
spec:
  replicas: 1 # state (watches, sessions) lives in the process; do not scale out
  selector:
    matchLabels:
      app.kubernetes.io/name: kubus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubus
    spec:
      serviceAccountName: kubus
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubus
          image: ghcr.io/flosch62/kubus:latest # pin a version (and digest) in production
          ports:
            - name: http
              containerPort: 3001
          # env:
          #   - name: KUBUS_AUTH
          #     value: none                         # only behind an authenticating proxy
          #   - name: KUBUS_ALLOWED_ORIGINS
          #     value: https://kubus.example.com
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config # settings.json (XDG config dir)
              mountPath: /home/node/.config
            - name: tmp # Helm engine work dirs
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kubus
  namespace: kubus
spec:
  selector:
    app.kubernetes.io/name: kubus
  ports:
    - name: http
      port: 3001
      targetPort: http
