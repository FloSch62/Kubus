packages:
  - shared
  - server
  - client
  - electron
  - tests
# Keep local lockfile updates aligned with pnpm 11's CI supply-chain policy.
minimumReleaseAge: 1440
# monaco-yaml's worker imports path-browserify, which is CJS-only; the Vite dev
# server serves worker-graph deps as native ESM without CJS interop, so the
# yaml worker dies with "module is not defined" (prod builds are unaffected).
# pathe is an ESM drop-in for node:path covering every function the worker uses.
overrides:
  "monaco-yaml>path-browserify": "npm:pathe@^2.0.3"
  # Monaco 0.55.1 pins an older DOMPurify with known XSS vulnerabilities.
  "monaco-editor>dompurify": "^3.4.12"
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  tar@<=7.5.20: ^7.5.21
  undici@<6.28.0: ^6.28.0
allowBuilds:
  esbuild: true
  node-pty: true
  electron: true
  sharp: true
  core-js-pure: false
  electron-winstaller: false
minimumReleaseAgeExclude:
  - tar@7.5.21
  - brace-expansion@1.1.18 || 2.1.4
  - undici@6.28.0
  - fast-uri@3.1.5
  - js-yaml@4.3.1
