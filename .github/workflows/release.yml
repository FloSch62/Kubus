name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional existing tag to publish/replace release assets for, e.g. v0.1.1'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KUBUS_NOTARIZE: ${{ matrix.os == 'macos-15' && '1' || '0' }}
      ELECTROBUN_TEAMID: DJY795VD98
      ELECTROBUN_DEVELOPER_ID: 'Developer ID Application: Florian Schwarz (DJY795VD98)'
    steps:
      - uses: actions/checkout@v7
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name. See docs/community/releasing.md."
              exit 1
            fi
          done
          umask 077
          certificate="$RUNNER_TEMP/kubus-signing.p12"
          keychain="$RUNNER_TEMP/kubus-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" | grep -F "$ELECTROBUN_DEVELOPER_ID"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: helm-engine/go.mod
          cache-dependency-path: helm-engine/go.sum
      - name: Cache Electrobun toolchains
        uses: actions/cache@v6
        with:
          path: ~/.hutch
          key: electrobun-2.0.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd xvfb libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        run: node hack/verify-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag || github.ref_name }}
      - run: pnpm -r build
      - run: pnpm build:helm-engine
      - name: Package Electrobun installers
        run: pnpm --filter @kubus/desktop dist
        env:
          ELECTROBUN_APPLEID: schwarz.flori.88@googlemail.com
          ELECTROBUN_APPLEIDPASS: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      - name: Package Debian installer
        if: runner.os == 'Linux'
        run: pnpm --filter @kubus/desktop deb
      - name: Verify artifacts and architecture
        run: node hack/verify-desktop-artifacts.mjs
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kubus-${{ matrix.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: desktop/artifacts/*
      - name: Remove Apple signing credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/kubus-signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/kubus-signing.p12"

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t artifacts < <(find release-assets -type f \( -name '*.tar.zst' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.deb' -o -name '*.zip' -o -name '*.json' -o -name '*.patch' \) -print)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --draft
          fi

          # Upload payloads before publishing manifests that point at them.
          payloads=()
          manifests=()
          for artifact in "${artifacts[@]}"; do
            if [[ "$artifact" == *-update.json ]]; then
              manifests+=("$artifact")
            else
              payloads+=("$artifact")
            fi
          done
          gh release upload "$RELEASE_TAG" "${payloads[@]}" --clobber
          gh release upload "$RELEASE_TAG" "${manifests[@]}" --clobber
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
