name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional existing tag to publish/replace release assets for, e.g. v0.1.1'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: helm-engine/go.mod
          cache-dependency-path: helm-engine/go.sum
      - name: Cache Electrobun toolchains
        uses: actions/cache@v6
        with:
          path: ~/.hutch
          key: electrobun-2.0.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd xvfb libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        run: node hack/verify-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag || github.ref_name }}
      - run: pnpm -r build
      - run: pnpm build:helm-engine
      - name: Package Electrobun installers
        run: pnpm --filter @kubus/desktop dist
      - name: Package Debian installer
        if: runner.os == 'Linux'
        run: pnpm --filter @kubus/desktop deb
      - name: Verify artifacts and architecture
        run: node hack/verify-desktop-artifacts.mjs
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kubus-${{ matrix.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: desktop/artifacts/*

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t artifacts < <(find release-assets -type f \( -name '*.tar.zst' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.deb' -o -name '*.zip' -o -name '*.json' \) -print)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi

          gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber
      # The docs deploy writes site/latest.json from the latest GitHub release,
      # which powers the in-app update check for all installed versions.
      - name: Refresh Pages update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main
