name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional existing tag to publish/replace release assets for, e.g. v0.1.1'
        required: false
        type: string

      notarization_status_only:
        description: 'Query Apple notarization history without building or publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  notarization-status:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.notarization_status_only }}
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Query Apple notarization history
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "::error::Missing APPLE_APP_SPECIFIC_PASSWORD repository secret."
            exit 1
          fi
          xcrun notarytool history \
            --apple-id schwarz.flori.88@googlemail.com \
            --team-id DJY795VD98 \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --output-format json | tee "$RUNNER_TEMP/notary-history.json"
          printf '### Apple notarization history\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notary-history.json" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

  build:
    if: ${{ !inputs.notarization_status_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish_tag || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: helm-engine/go.mod
          cache-dependency-path: helm-engine/go.sum
      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        run: node hack/verify-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag || github.ref_name }}
      - run: pnpm -r build
      - run: pnpm build:helm-engine
      - name: Package
        run: pnpm --filter @kubus/electron dist
        env:
          KUBUS_RELEASE: '1'
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: schwarz.flori.88@googlemail.com
          APPLE_TEAM_ID: DJY795VD98
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING || 'unsigned' }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_P12_BASE64 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          WINDOWS_CERTIFICATE_SHA1: ${{ vars.WINDOWS_CERTIFICATE_SHA1 }}
          WINDOWS_SIGN_SCRIPT: ${{ vars.WINDOWS_SIGN_SCRIPT }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
      - name: Verify macOS signatures and notarization
        if: runner.os == 'macOS'
        run: node hack/verify-macos-artifacts.mjs
      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./hack/verify-windows-signatures.ps1
        env:
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING || 'unsigned' }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
      - name: Package for Microsoft Store
        if: runner.os == 'Windows'
        run: pnpm --filter @kubus/electron dist:store
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged updater against localhost
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:updater
      - name: Verify artifacts
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)
              test -n "$(find electron/release -maxdepth 1 -name '*.AppImage' -print -quit)"
              test -n "$(find electron/release -maxdepth 1 -name '*.deb' -print -quit)"
              test -f electron/release/latest-linux.yml
              ;;
            macOS)
              test -n "$(find electron/release -maxdepth 1 -name '*.zip' -print -quit)"
              test -f electron/release/latest-mac.yml
              ;;
            Windows)
              test -n "$(find electron/release -maxdepth 1 -name '*.exe' -print -quit)"
              test -f electron/release/latest.yml
              test -n "$(find electron/release-store -maxdepth 1 -name '*.appx' -print -quit)"
              ;;
          esac
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kubus-${{ matrix.os }}
          if-no-files-found: error
          path: |
            electron/release/*.exe
            electron/release/*.dmg
            electron/release/*.zip
            electron/release/*.blockmap
            electron/release/latest*.yml
            electron/release/*.AppImage
            electron/release/*.deb
      # Microsoft signs this package after certification. Keep the unsigned
      # submission out of the public GitHub installer downloads.
      - name: Upload Microsoft Store package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: kubus-windows-store
          if-no-files-found: error
          path: electron/release-store/*.appx

  publish:
    if: ${{ !inputs.notarization_status_only && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t artifacts < <(find release-assets -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest*.yml' \) -print)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            base="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG"
            version="${RELEASE_TAG#v}"
            printf '%s\n' \
              '### Downloads' '' \
              "- **macOS (Apple Silicon):** [Download DMG]($base/kubus-$version-mac-arm64.dmg), then drag Kubus into Applications." \
              "- **Windows:** [Download installer]($base/kubus-$version-win-x64.exe)." \
              "- **Linux:** [AppImage]($base/kubus-$version-linux-x86_64.AppImage) · [Debian / Ubuntu]($base/kubus-$version-linux-amd64.deb)." '' \
              'The ZIP, blockmap and YAML assets below are used by in-app updates.' \
              > "$RUNNER_TEMP/release-intro.md"
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --notes-file "$RUNNER_TEMP/release-intro.md" --draft
          fi

          # Payloads and differential blockmaps must exist before update feeds refer to them.
          payloads=()
          manifests=()
          for artifact in "${artifacts[@]}"; do
            if [[ "$artifact" == *.yml ]]; then manifests+=("$artifact"); else payloads+=("$artifact"); fi
          done
          gh release upload "$RELEASE_TAG" "${payloads[@]}" --clobber
          gh release upload "$RELEASE_TAG" "${manifests[@]}" --clobber
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
      # The docs deploy writes site/latest.json from the latest GitHub release,
      # for browser installs and desktop versions predating electron-updater.
      - name: Refresh Pages update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main

  publish-store:
    # The first Store release is submitted in Partner Center. The script checks
    # for a published submission before it uploads any subsequent release.
    if: ${{ github.repository == 'FloSch62/Kubus' && !contains(inputs.publish_tag || github.ref_name, '-') }}
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: microsoft-store-kubus
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish_tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          name: kubus-windows-store
          path: store-package
      - uses: microsoft/microsoft-store-apppublisher@v1.1
        with:
          version: v0.4.2
      - name: Configure Microsoft Store credentials
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          foreach ($name in @('AZURE_AD_TENANT_ID', 'AZURE_AD_APPLICATION_CLIENT_ID', 'AZURE_AD_APPLICATION_SECRET', 'SELLER_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing GitHub Actions secret: $name"
            }
          }
          msstore reconfigure --tenantId "$env:AZURE_AD_TENANT_ID" --sellerId "$env:SELLER_ID" --clientId "$env:AZURE_AD_APPLICATION_CLIENT_ID" --clientSecret "$env:AZURE_AD_APPLICATION_SECRET"
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store authentication configuration failed.' }
      - name: Submit Store update for certification
        run: node hack/publish-microsoft-store.mjs store-package
