name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR (or main) supersedes in-flight runs for the same ref;
# cancel the stale ones to free runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Report every OS result; don't cancel the matrix on the first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: helm-engine/go.mod
          cache-dependency-path: helm-engine/go.sum
      - name: Cache Electrobun toolchains
        uses: actions/cache@v6
        with:
          path: ~/.hutch
          key: electrobun-2.0.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 webkit2gtk-driver
      - run: pnpm install --frozen-lockfile
      # build first: @kubus/shared (and /server for desktop) resolve types
      # from their dist/, which doesn't exist on a fresh checkout
      - run: pnpm build
      - run: pnpm build:helm-engine
      - run: pnpm --filter @kubus/desktop run pack
      # One platform also collects repository-wide coverage and enforces the
      # non-regression floors; every matrix job exposes the same always-running
      # test step so OS-specific behavior is visible without misleading skips.
      - name: Unit tests
        run: pnpm ${{ runner.os == 'Linux' && 'test:coverage' || 'test' }}
      # The namespace selector lives inside a native draggable title bar. Run
      # the actual system WebKitGTK renderer using its W3C automation driver.
      # macOS/Windows retain build, unit, and server/runtime smoke coverage.
      - name: Electrobun end-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum sh -c 'openbox >/tmp/kubus-openbox.log 2>&1 & pnpm test:desktop'
      - name: Upload Electrobun diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-report-${{ runner.os }}
          path: |
            tests/desktop-report
            tests/desktop/.results
          retention-days: 7
      - name: Upload coverage report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: tests/coverage
          retention-days: 7
      # Type-aware linting also resolves workspace package declarations.
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Package and verify macOS signatures
        if: runner.os == 'macOS'
        run: |
          pnpm --filter @kubus/desktop dist
          node hack/verify-desktop-artifacts.mjs
      # Boot the app's server on each OS to catch runtime startup regressions
      # (won't listen, missing static assets, crash-on-boot) that packaging
      # alone misses. Headless, so it needs no display on any runner.
      - run: pnpm smoke
      - run: pnpm smoke:helm

  # Full-stack Playwright suite: built client + real server + a kind cluster
  # seeded with the fixtures in tests/e2e/fixtures.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v7
        with:
          go-version-file: helm-engine/go.mod
          cache-dependency-path: helm-engine/go.sum
      - name: Cache Electrobun toolchains
        uses: actions/cache@v6
        with:
          path: ~/.hutch
          key: electrobun-2.0.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Linux desktop libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 webkit2gtk-driver
      - run: pnpm build
      - run: pnpm build:helm-engine
      - run: pnpm --filter @kubus/desktop run pack
      # Cluster name kubus-a matches the local dev clusters, so the suite
      # runs unchanged in both places (context kind-kubus-a).
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kubus-a
      - run: pnpm --filter @kubus/tests exec playwright install --with-deps webkit
      - run: pnpm test:e2e
        env:
          KUBUS_E2E_RUNTIME: bun
          PLAYWRIGHT_BROWSER: webkit
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/e2e/.results
          retention-days: 7
