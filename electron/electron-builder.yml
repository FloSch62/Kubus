appId: io.github.flosch62.kubus
productName: Kubus
executableName: kubus
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
asar: true
extraResources:
  - from: ../client/dist
    to: client
  - from: ../server/assets/helm-engine.wasm.gz
    to: helm-engine.wasm.gz
  - from: build/icons/256x256.png
    to: icon.png
icon: build/icon.png
artifactName: kubus-${version}-${os}-${arch}.${ext}
protocols:
  - name: Kubus
    schemes: [kubus]
npmRebuild: false
afterPack: scripts/after-pack.cjs
appxManifestCreated: scripts/appx-manifest.cjs
win:
  target:
    - target: nsis
      arch: [x64]
appx:
  identityName: FloSch.me.Kubus
  publisher: CN=7F1CC962-95FE-4843-B655-1EC6FF3D190E
  publisherDisplayName: FloSch.me
  applicationId: Kubus
  displayName: Kubus
  backgroundColor: transparent
  languages: [en-US]
  minVersion: 10.0.19041.0
  # The Store reserves the fourth version component; it must remain zero.
  setBuildNumber: false
  capabilities: [runFullTrust]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.developer-tools
  identity: null
  notarize: false
  target:
    - target: dmg
      arch: [arm64]
    # Squirrel.Mac downloads the signed app from this archive.
    - target: zip
      arch: [arm64]
dmg:
  sign: false
deb:
  afterInstall: linux/after-install.tpl
linux:
  category: Development
  synopsis: Kubernetes GUI
  icon: build/icons
  desktop:
    entry:
      StartupWMClass: Kubus
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
publish:
  provider: github
  owner: FloSch62
  repo: Kubus
  releaseType: release
